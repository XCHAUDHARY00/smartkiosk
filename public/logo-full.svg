<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <filter id="soft-glow-full" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="ring-glow-full" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ecg-line-full" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Circular Badge -->
  <g transform="translate(50, 20)">
    <!-- Outer Soft Ring -->
    <circle cx="250" cy="250" r="236" fill="#f0f9ff" stroke="#bae6fd" stroke-width="6" opacity="0.6"/>
    
    <!-- Main Blue Circular Border -->
    <circle cx="250" cy="250" r="220" fill="#ffffff" stroke="url(#ring-glow-full)" stroke-width="14"/>

    <!-- Dark Navy Medical Cross -->
    <g fill="#0f172a">
      <rect x="130" y="210" width="240" height="80" rx="32" ry="32" />
      <rect x="210" y="130" width="80" height="240" rx="32" ry="32" />
    </g>

    <!-- Electric Cyan Heartbeat / ECG Waveform Overlay -->
    <path d="M 115 250 L 195 250 L 225 175 L 255 330 L 285 160 L 315 250 L 385 250" 
          fill="none" 
          stroke="url(#ecg-line-full)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#soft-glow-full)" />
  </g>

  <!-- Typography matching exact uploaded logo -->
  <text x="300" y="565" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="2">SMART OPD</text>
  <text x="300" y="605" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#64748b" letter-spacing="4">AI CLINICAL INTAKE &amp; TRIAGE</text>
</svg>
